# The Databricks side: views, dashboard, and the source-agreement model.
#
# Separate from the weekly refresh on purpose. The weekly job's job is to get a
# correct page published; this one reshapes what is already in the lakehouse and
# trains on it. If it breaks, nothing a reader sees breaks with it.

name: databricks build

on:
  workflow_dispatch:
    inputs:
      what:
        description: "views | model | quality | docs | all"
        default: "all"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install databricks-sdk mlflow scikit-learn numpy

      - name: Views, saved queries, dashboard
        if: inputs.what == 'views' || inputs.what == 'all'
        run: python3 scripts/databricks_views.py

      - name: Data quality profile and constraints
        if: inputs.what == 'quality' || inputs.what == 'all'
        run: |
          python3 scripts/databricks_quality.py
          python3 scripts/databricks_quality.py --history

      - name: Column comments and lineage
        if: inputs.what == 'docs' || inputs.what == 'all'
        run: |
          python3 scripts/databricks_lineage.py
          python3 scripts/databricks_lineage.py --lineage

      - name: Source-agreement model
        if: inputs.what == 'model' || inputs.what == 'all'
        run: python3 scripts/train_avm.py
