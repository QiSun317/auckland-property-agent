# Weekly refresh: fetch whatever is due, rebuild the page, publish it.
#
# Runs whether or not the laptop is awake, which is the whole point — the
# launchd job in ops/ only fires if the machine is on. The two can coexist:
# both read data/raw as the source of truth and both leave the same state
# behind, so whichever ran last is simply the current one.
#
# State, because a clean checkout has none:
#   * data/raw  -> actions/cache. Bulky and fully re-derivable, so a cache miss
#     costs about six minutes of refetching and nothing else. Never correctness.
#   * data/state -> the ci-state branch. Small and NOT re-derivable: the
#     accumulated market_snapshot, the per-source fetch times, and the Delta
#     table of carded rates. Without the fetch times every run thinks every
#     source is due and re-scrapes 217 pages for data that changes quarterly;
#     without the Delta table every week of rate history is thrown away, which
#     is the thing it exists to stop.
#
# Publishing is skipped unless SITE_DEPLOY_KEY is set, so this workflow is
# useful the moment it lands and starts publishing when the key is added. See
# the README section "每周自动刷新" for how to create it.

name: weekly refresh

on:
  schedule:
    # 19:00 UTC Sunday = 07:00 Monday in Auckland (08:00 while daylight saving
    # is on; GitHub cron has no timezones and an hour either way does not
    # matter for a job nobody is waiting on).
    - cron: "0 19 * * 0"
  workflow_dispatch:
    inputs:
      force:
        description: "sources to force (space separated, or 'all')"
        default: ""

concurrency:
  group: refresh
  cancel-in-progress: false

permissions:
  contents: write        # to push the ci-state branch

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SITE_DEPLOY_KEY: ${{ secrets.SITE_DEPLOY_KEY }}
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install duckdb deltalake 'pyarrow>=21' databricks-sdk mlflow
      - run: npm --prefix evals install --no-audit --no-fund

      # Bulky, re-derivable. Restored for speed; a miss just refetches.
      - name: Restore data/raw
        uses: actions/cache@v4
        with:
          path: data/raw
          key: raw-${{ github.run_id }}
          restore-keys: raw-

      # Tiny, not re-derivable. This is the one that matters.
      - name: Restore accumulated history
        run: |
          if git ls-remote --exit-code --heads origin ci-state >/dev/null 2>&1; then
            git fetch --depth 1 origin ci-state
            git checkout FETCH_HEAD -- data/state
            du -sh data/state; ls data/state
          else
            echo "no ci-state branch yet — first run, starting clean"
          fi

      - name: Run pipeline
        run: |
          python3 scripts/pipeline.py run --trigger schedule \
            ${{ inputs.force && format('--force {0}', inputs.force) || '' }}

      - name: Save accumulated history
        run: |
          # A week where nothing was due rebuilds nothing, so there is no
          # database to export from — and nothing to export, because the state
          # already on the branch is still current. Fetch times are absolute.
          if [ ! -f data/auckland.duckdb ]; then
            echo "nothing was due this week — state on ci-state is unchanged"
            exit 0
          fi
          python3 scripts/export_state.py
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf .state-push
          git init -q .state-push
          # Mirror the repo layout, so the restore step above is the exact
          # inverse of this. Flattening it to the branch root instead made the
          # first run push fine and the second run fail on checkout.
          mkdir -p .state-push/data
          # The whole directory: history.duckdb.gz plus the bank_rate Delta
          # table, which is a directory of parquet and a transaction log.
          cp -R data/state .state-push/data/
          cd .state-push
          git checkout -q -b ci-state
          git add data/state
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "state after run $(date -u +%Y-%m-%d)"
          # Force-push a single-commit branch: this is machine state, not
          # history worth keeping, and 52 commits a year of a binary would only
          # grow the repo.
          git push -q --force \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" \
            ci-state

      # Before publishing, and allowed to fail the run. These cases are the
      # ways the agent has actually been wrong; if one of them comes back,
      # the verification the page relies on is not working and a page whose
      # figures are unverified should not go out.
      - name: Agent gate suite
        run: |
          if [ ! -f heatmap.html ]; then
            echo "nothing was rebuilt this week — no page to check"
            exit 0
          fi
          python3 scripts/eval_agent.py

      - name: Publish the page
        if: env.SITE_DEPLOY_KEY != ''
        env:
          AKL_SITE_REMOTE: git@github.com:QiSun317/auckland-house-heatmap.git
        run: |
          # A week where no source was due rebuilds nothing, so there is no
          # page to push. That is success, not failure.
          if [ ! -f heatmap.html ]; then
            echo "nothing was due this week — no rebuild, nothing to publish"
            exit 0
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "$SITE_DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ./ops/publish.sh "Weekly refresh"

      - name: Say why nothing was published
        if: env.SITE_DEPLOY_KEY == ''
        run: |
          echo "SITE_DEPLOY_KEY is not set, so the page was built but not published."
          echo "The built page is attached to this run as an artifact."

      # After publishing, deliberately. Free Edition compute cannot reach the
      # sites this project scrapes, so Databricks is a destination rather than
      # a dependency — and the page should never wait on it, or fail with it.
      - name: Sync to Unity Catalog
        if: env.DATABRICKS_HOST != ''
        run: |
          if [ ! -f data/auckland.duckdb ]; then
            echo "nothing was rebuilt this week — nothing new to sync"
            exit 0
          fi
          python3 scripts/databricks_sync.py
          # The one table that accumulates, so it is merged rather than
          # replaced — and merged there rather than here.
          python3 scripts/databricks_rates.py

      - name: Keep the outputs either way
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: page-and-logs
          path: |
            heatmap.html
            data/join_report.txt
            data/state/**
            logs/pipeline.jsonl
          if-no-files-found: warn
          retention-days: 30
