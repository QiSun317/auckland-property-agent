# Does the workspace answer, and what is actually in it?
#
# Run this first and after any credential change. Everything else that talks to
# Databricks assumes the answers here, and a bad token fails in ways that look
# like a dozen different bugs further down.
#
# The token never leaves the secret: the SDK reads DATABRICKS_HOST and
# DATABRICKS_TOKEN from the environment itself, and nothing here prints them.

name: databricks check

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install databricks-sdk

      - name: Who are we, and what can we see
        run: |
          python3 - <<'PY'
          import os, sys
          from databricks.sdk import WorkspaceClient

          host = os.environ.get("DATABRICKS_HOST", "")
          if not host:
              sys.exit("DATABRICKS_HOST is empty — is the secret set?")
          print(f"host: {host}")

          w = WorkspaceClient()

          me = w.current_user.me()
          print(f"\nauthenticated as: {me.user_name}")

          print("\ncatalogs:")
          cats = list(w.catalogs.list())
          for c in cats:
              print(f"  {c.name:<24} {c.catalog_type}")
          if not cats:
              print("  (none — Unity Catalog may not be provisioned yet)")

          print("\nschemas in the first non-system catalog:")
          target = next((c for c in cats if c.name not in ("system", "samples")), None)
          if target:
              for s in w.schemas.list(catalog_name=target.name):
                  print(f"  {target.name}.{s.name}")

          print("\nSQL warehouses:")
          whs = list(w.warehouses.list())
          for wh in whs:
              print(f"  {wh.name:<24} {wh.cluster_size:<12} state={wh.state}")
          if not whs:
              print("  (none — one has to be created before SQL will run)")

          print("\nvolumes we could upload raw files into:")
          if target:
              found = False
              for s in w.schemas.list(catalog_name=target.name):
                  for v in w.volumes.list(catalog_name=target.name, schema_name=s.name):
                      print(f"  /Volumes/{target.name}/{s.name}/{v.name}")
                      found = True
              if not found:
                  print("  (none yet — we create one)")
          PY

      # Which credentials this workspace will actually accept. A stored PAT
      # is the weakest of them and the one we are using; this says whether
      # anything better is reachable.
      - name: What kinds of credential are available
        run: |
          python3 - <<'PY'
          from databricks.sdk import WorkspaceClient
          w = WorkspaceClient()
          cfg = w.config
          print(f"authenticating with: {cfg.auth_type}")

          def probe(label, fn):
              try:
                  n = len(list(fn()))
                  print(f"  yes   {label:<34} ({n} found)")
              except Exception as e:
                  print(f"  no    {label:<34} {str(e).splitlines()[0][:90]}")

          probe("service principals (workspace)", lambda: w.service_principals.list())
          probe("users (SCIM)", lambda: w.users.list())
          probe("groups", lambda: w.groups.list())
          probe("token management", lambda: w.token_management.list())
          probe("own tokens", lambda: w.tokens.list())
          try:
              import databricks.sdk.core as c
              print("\n  auth methods the SDK would try, in order:")
              for m in c.DefaultCredentials().__class__.__mro__[:1]:
                  pass
              from databricks.sdk.credentials_provider import DefaultCredentials
              print("   ", ", ".join(p.auth_type() for p in DefaultCredentials()._auth_providers))
          except Exception as e:
              print("  (could not enumerate providers:", str(e)[:80], ")")
          PY

      - name: What the plan needs, and whether it is here
        run: |
          python3 - <<'PY'
          from databricks.sdk import WorkspaceClient
          w = WorkspaceClient()
          checks = []

          def note(label, ok, detail=""):
              checks.append((label, ok, detail))

          cats = [c.name for c in w.catalogs.list()]
              # a writable catalog is where every table in the plan lands
          usable = [c for c in cats if c not in ("system", "samples")]
          note("a writable catalog", bool(usable), ", ".join(usable) or "none found")

          whs = list(w.warehouses.list())
          note("a SQL warehouse", bool(whs),
               ", ".join(f"{x.name} ({x.cluster_size})" for x in whs) or "none found")

          try:
              list(w.jobs.list())
              note("jobs API reachable", True)
          except Exception as e:
              note("jobs API reachable", False, str(e)[:80])

          print()
          for label, ok, detail in checks:
              print(f"  {'ok  ' if ok else 'todo'}  {label:<24} {detail}")
          PY
