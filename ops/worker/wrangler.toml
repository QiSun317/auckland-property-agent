name = "auckland-suburb-agent"
main = "worker.js"
compatibility_date = "2026-01-01"

[vars]
# Only this origin may call the proxy. Leave as "*" while testing locally.
ALLOWED_ORIGIN = "https://qisun317.github.io"
MODEL = "gemini-2.5-flash-lite"

# 12 requests per minute per IP. The free Gemini quota is the real ceiling;
# this stops one script from spending all of it in a burst.
[[unsafe.bindings]]
name = "RATE_LIMIT"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 12, period = 60 }
